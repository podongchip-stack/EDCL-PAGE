<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="soc" x1="32" y1="18" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- 배지 바탕 -->
  <rect width="64" height="64" rx="14" fill="#020617"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- 배터리 단자 -->
